<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons: the avatar, cropped to a circle (see scripts/ for how they were made). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- The site is dark by design: tell the browser, and darkening extensions,
         to leave it alone. The page background is neutral rgb(25, 25, 25). -->
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#191919" />
    <meta name="darkreader-lock" />

    <title>雨林观察者的博客</title>
    <meta name="description" content="我目前只有播客(｡•́︿•̀｡)" />

    <!-- Podcast feed, regenerated by scripts/generate-feed.mjs -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="雨林观察者的博客"
      href="/feed.xml"
    />

    <!-- Self-hosted Chinese serif subset (see scripts/build-cjk-font.mjs). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/noto-serif-sc-subset.woff2"
      crossorigin
    />

    <style>
      /* Paint the neutral background before the bundle loads (no white flash). */
      html {
        background: #191919;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
