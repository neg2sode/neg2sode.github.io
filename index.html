<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons: the avatar, cropped to a circle (see scripts/ for how they were made). -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Two neutral palettes: night (page on rgb(25,25,25)) and day (white).
         Follow the system preference; tell extensions not to repaint it. -->
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1d1d1d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="darkreader-lock" />

    <title>雨林观察者的博客</title>
    <meta name="description" content="我目前只有播客(｡•́︿•̀｡)" />

    <!-- Podcast feed, regenerated by scripts/generate-feed.mjs -->
    <link
      rel="alternate"
      type="application/rss+xml"
      title="雨林观察者的博客"
      href="/feed.xml"
    />

    <!-- Self-hosted Chinese serif subset (see scripts/build-cjk-font.mjs). -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/noto-serif-sc-subset.woff2"
      crossorigin
    />

    <style>
      /* Paint the right neutral background before the bundle loads. */
      html {
        background: #1d1d1d;
      }
      @media (prefers-color-scheme: light) {
        html {
          background: #ffffff;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
